[package]
name = "bondhive-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bondhive core: NIP-01/NIP-74 event model, canonical serialization, Schnorr signing, BondScore math"

[dependencies]
# BIP-340 Schnorr is compiled in by default; `rand` enables keypair generation.
secp256k1 = { version = "0.29", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
